<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DO STREAKLY — Animated App Icon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .label {
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      text-align: center;
    }
    .icon-wrap {
      position: relative;
      overflow: hidden;
      background: #B6F34A;
      flex-shrink: 0;
      animation: bgPulse 2.4s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .icon-wrap.xl  { width:240px; height:240px; border-radius:54px; }
    .icon-wrap.md  { width:128px; height:128px; border-radius:28px; }
    .icon-wrap.sm  { width:72px;  height:72px;  border-radius:16px; }
    .icon-wrap.xs  { width:48px;  height:48px;  border-radius:11px; }
    .icon-wrap svg { width:100%; height:100%; display:block; }
    @keyframes bgPulse {
      0%,38%,68%,100% { box-shadow:0 0 0 0 rgba(182,243,74,0); }
      52% { box-shadow:0 0 0 6px rgba(182,243,74,0.45),0 0 50px 20px rgba(182,243,74,0.22); }
    }
    .bg-rect { animation:bgFill 2.4s ease-in-out infinite; }
    @keyframes bgFill {
      0%,38%,68%,100% { fill:#B6F34A; }
      52%              { fill:#c8ff55; }
    }
    .left-fig {
      animation:leftMove 2.4s cubic-bezier(0.4,0,0.2,1) infinite;
      transform-box:fill-box;
      transform-origin:center bottom;
    }
    @keyframes leftMove {
      0%,18%   { transform:translateX(0px)  translateY(0px)  scale(1); }
      46%      { transform:translateX(18px) translateY(-3px) scale(1.05); }
      52%      { transform:translateX(18px) translateY(-5px) scale(1.08); }
      58%      { transform:translateX(18px) translateY(-3px) scale(1.05); }
      68%      { transform:translateX(7px)  translateY(3px)  scale(0.97); }
      80%      { transform:translateX(2px)  translateY(0px)  scale(1); }
      90%,100% { transform:translateX(0px)  translateY(0px)  scale(1); }
    }
    .right-fig {
      animation:rightMove 2.4s cubic-bezier(0.4,0,0.2,1) infinite;
      transform-box:fill-box;
      transform-origin:center bottom;
    }
    @keyframes rightMove {
      0%,18%   { transform:translateX(0px)   translateY(0px)  scale(1); }
      46%      { transform:translateX(-18px) translateY(-3px) scale(1.05); }
      52%      { transform:translateX(-18px) translateY(-5px) scale(1.08); }
      58%      { transform:translateX(-18px) translateY(-3px) scale(1.05); }
      68%      { transform:translateX(-7px)  translateY(3px)  scale(0.97); }
      80%      { transform:translateX(-2px)  translateY(0px)  scale(1); }
      90%,100% { transform:translateX(0px)   translateY(0px)  scale(1); }
    }
    .sparks {
      animation:sparkPop 2.4s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }
    @keyframes sparkPop {
      0%,44%  { opacity:0; transform:scale(0.4); }
      50%     { opacity:1; transform:scale(1); }
      56%     { opacity:0.6; transform:scale(1.15); }
      62%,100%{ opacity:0; transform:scale(1.4); }
    }
    .flash { animation:flashPop 2.4s ease-in-out infinite; }
    @keyframes flashPop {
      0%,48%  { opacity:0; }
      52%     { opacity:0.4; }
      58%,100%{ opacity:0; }
    }
    .motion-trail-left {
      animation:trailL 2.4s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:right center;
    }
    .motion-trail-right {
      animation:trailR 2.4s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:left center;
    }
    @keyframes trailL {
      0%,20%  { opacity:0; transform:scaleX(0); }
      35%     { opacity:0.45; transform:scaleX(1); }
      50%,100%{ opacity:0; transform:scaleX(1.2); }
    }
    @keyframes trailR {
      0%,20%  { opacity:0; transform:scaleX(0); }
      35%     { opacity:0.45; transform:scaleX(1); }
      50%,100%{ opacity:0; transform:scaleX(1.2); }
    }
    .preview-row { display:flex; align-items:flex-end; gap:28px; }
    .preview-item { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .tag { color:rgba(182,243,74,0.5); font-size:10px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase; }
  </style>
